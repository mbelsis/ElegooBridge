# Bambuddy connects here, exactly as to a Bambu printer: TLS, user bblp, access code.
listener 8883
protocol mqtt
cafile /mosquitto/certs/server.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2

# The bridge connects inside the Docker network only; this port is not published.
listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/data/passwd
persistence false
log_dest stdout
allow_zero_length_clientid true
